    <!-- Replaced script: correct QASMI audio filename normalizer -->
    <script>
    (function(){
      try {
        var totalSurahs = 114;
        // Ensure base and mapping exist
        window.QASMI_AUDIO_BASE = window.QASMI_AUDIO_BASE || 'https://archive.org/download/QuranByQariShakirQasmi/';
        if (typeof window.QASMI_AUDIO_FILES === 'undefined' || window.QASMI_AUDIO_FILES === null) window.QASMI_AUDIO_FILES = {};
        for (var i = 1; i <= totalSurahs; i++) {
          window.QASMI_AUDIO_FILES[i] = String(i).padStart(3, '0') + '.mp3';
        }
        // Helper to get a full URL for a surah (optional)
        window.qasmiFileFor = function(surahNumber) {
          var n = Number(surahNumber) || 1;
          return window.QASMI_AUDIO_BASE + String(n).padStart(3, '0') + '.mp3';
        };
      } catch (e) {
        console.error('QASMI filename normalizer failed', e);
      }
    })();
    </script>
