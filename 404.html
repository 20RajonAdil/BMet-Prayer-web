  html,body{margin:0;height:100%;background:var(--deep);color:var(--paper);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
  #root{min-height:100vh;min-height:100dvh}
  .sky{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
       background:radial-gradient(ellipse 80% 60% at 50% 42%,#10604A 0%,var(--mid) 42%,var(--deep) 100%)}
  /* stars */
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,4s) ease-in-out var(--l,0s) infinite;opacity:.8}

  .cloud::before{width:55%;left:12%;top:-18px}.cloud::after{width:40%;left:38%;top:18px}
  @keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(135vw)}}
  .par{transition:transform .25s ease-out;will-change:transform}
  .bg{position:absolute;inset:-20px;pointer-events:none}

  header{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:16px clamp(16px,4vw,40px)}

  header b{display:block;font-size:1.25rem;letter-spacing:-.3px}header b span{color:var(--gold2)}
  header small{display:block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;opacity:.65}
  .tag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(240,205,110,.5);color:var(--gold2);padding:6px 12px;border-radius:999px}

  main{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 18px 30px}
  .stage{position:relative;display:flex;align-items:center;justify-content:center;gap:calc(var(--fs)*.04);margin-top:4vh}
  .digit{position:relative;z-index:2;font-size:var(--fs);line-height:1;font-weight:700;color:#FBF8EC;letter-spacing:-.04em;text-shadow:0 8px 40px rgba(0,0,0,.35);

  @keyframes rise{to{opacity:1;transform:none}}
  .moonwrap{position:relative;width:calc(var(--fs)*.8);height:calc(var(--fs)*.8);display:flex;align-items:center;justify-content:center;opacity:0;animation:fade 1s ease .35s forwards}

  @keyframes pulse{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.06);opacity:1}}
  .moon{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 36% 32%,#FFFDF2 0%,#FFF3C9 55%,#F0D98E 100%);box-shadow:0 0 60px 10px rgba(240,205,110,.55),inset -10px -12px 24px rgba(212,169,60,.35);animation:spin 40s linear infinite}

  @keyframes spin{to{transform:rotate(360deg)}}
  /* astronaut */

  .tether{position:absolute;right:62%;top:30%;width:calc(var(--fs)*1.4);height:calc(var(--fs)*1.8);overflow:visible;pointer-events:none}

  /* text */

  @keyframes caret{50%{opacity:0}}
  .lead{max-width:560px;margin:0 auto 22px;opacity:0;font-size:clamp(.95rem,2.4vw,1.08rem);line-height:1.55;color:#D6E2DB;animation:fade .8s ease 2.4s forwards}
  .lead b{color:var(--gold2);font-weight:600}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;opacity:0;animation:fade .8s ease 2.7s forwards}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font:700 1rem/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer;border:2px solid var(--gold);transition:transform .18s,box-shadow .18s}
  .btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1B1405;box-shadow:0 12px 26px -10px rgba(212,169,60,.7)}

  .btn:hover{transform:translateY(-2px) scale(1.03)}.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .linkbox{margin-top:26px;opacity:0;animation:fade .8s ease 3s forwards;max-width:100%}
  .linkbox small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.65;margin-bottom:8px}
  .pill{display:inline-flex;max-width:100%;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(240,205,110,.45);border-radius:999px;padding:6px 6px 6px 16px}
  .pill a{color:var(--gold2);font-weight:600;text-decoration:none;font-size:clamp(.78rem,2.6vw,.95rem);overflow-wrap:anywhere;text-align:left}
  .pill a:hover{text-decoration:underline}
  .pill button{border:0;border-radius:999px;background:var(--gold);color:#1B1405;font:700 12px inherit;font-family:inherit;padding:8px 14px;cursor:pointer;flex:none}
  .lost{margin-top:12px;font-size:12px;opacity:.55;overflow-wrap:anywhere}
  footer{position:relative;z-index:4;text-align:center;font-size:12px;opacity:.55;padding:0 16px 18px}
  noscript{display:block;padding:40px;text-align:center}noscript a{color:var(--gold2)}
  @media (max-width:640px){
    .astro{left:auto;right:6%;top:calc(var(--fs)*-.72);width:calc(var(--fs)*.55)}
    .tether{right:auto;left:-30%;top:40%;width:calc(var(--fs)*1.1);height:calc(var(--fs)*1.2)}
    .tag{display:none}.stage{margin-top:9vh}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition:none!important}
    .digit,.moonwrap,.astro,.lead,.actions,.linkbox{opacity:1!important;transform:none!important}}
</style>
