<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Petition admin • BMet Prayer</title>
<link rel="icon" href="favicon-32x32.png">
<style>
  :root{--green:#0E4B3A;--gold:#D4A93C;--paper:#F3F1E6;--ink:#16231D;--line:#D9D4C0}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:var(--green);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}header img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
  header h1{font-size:1.1rem;margin:0}header small{opacity:.8}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
  label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}input{width:100%;padding:12px;font-size:16px;border:1.5px solid #CFC9B0;border-radius:12px}
  button{font-family:inherit;cursor:pointer}.btn{padding:11px 20px;border-radius:999px;border:2px solid var(--green);background:#fff;color:var(--green);font-weight:800;font-size:14px}
  .btn.primary{background:var(--green);color:#fff}.btn:disabled{opacity:.5}
  .err{color:#9A3B2B;font-weight:600;margin-top:10px;font-size:14px}
  #login{max-width:420px;margin:40px auto}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.bar .count{font-weight:800;font-size:1.1rem;margin-right:auto}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
  table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid #ECE8D8;text-align:left;vertical-align:middle}
  th{background:var(--green);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
  td img{height:38px;max-width:120px;object-fit:contain;display:block}
  .del{border:0;background:none;color:#9A3B2B;font-weight:700;font-size:13px}
  .muted{color:#5B6B63;font-size:13px}
</style>
</head>
<body>
<header><img src="bmet-logo.png" alt=""><div><h1>Bigger Friday Prayer Room — Petition</h1><small>Admin • private</small></div></header>
<main>
  <div class="card" id="login">
    <h2 style="margin-top:0">Sign in</h2>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus>
    <div class="err" id="loginErr"></div>
    <p><button class="btn primary" id="loginBtn">Sign in</button></p>
    <p class="muted">Only the petition organiser can view the signatures.</p>
  </div>
  <div id="panel" style="display:none">
    <div class="bar">
      <span class="count" id="count">0 signatures</span>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="csv">Download CSV</button>
      <button class="btn primary" id="pdf">Download PDF</button>
      <button class="btn" id="logout">Sign out</button>
    </div>
    <div class="err" id="panelErr"></div>
    <div class="wrap"><table><thead><tr><th>#</th><th>Student name</th><th>ID number</th><th>Course name</th><th>Year</th><th>Date</th><th>Signature</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<script src="petition-config.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.PETITION_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var token = null, records = [];
  var BASE = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(CFG.projectId || '') + '/databases/(default)/documents/petition';
  var STATEMENT = "We respectfully request permission to use the ground floor hall for approximately 20 minutes every Friday for Jumu'ah prayer, between 12:00 pm and 1:30 pm, because our current prayer room has limited space. The students below support this request.";

  if (!CFG.projectId || !CFG.apiKey || !CFG.adminEmail) { $('loginErr').textContent = 'The petition is not connected yet — fill in projectId, apiKey and adminEmail in petition-config.js first (see SETUP-PETITION.md).'; $('loginBtn').disabled = true; }

  function fmtDate(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : (iso || ''); }
  function safeSig(s) { return typeof s === 'string' && s.indexOf('data:image/png;base64,') === 0 ? s : ''; }

  $('loginBtn').onclick = login;
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  function login() {
    $('loginErr').textContent = ''; $('loginBtn').disabled = true;
    fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(CFG.apiKey), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: CFG.adminEmail, password: $('pw').value, returnSecureToken: true })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        $('loginBtn').disabled = false;
        if (!x.ok) { $('loginErr').textContent = 'Incorrect password.'; return; }
        token = x.j.idToken; $('pw').value = '';
        $('login').style.display = 'none'; $('panel').style.display = ''; load();
      }).catch(function () { $('loginBtn').disabled = false; $('loginErr').textContent = 'Could not connect. Check your internet and try again.'; });
  }
  $('logout').onclick = function () { token = null; records = []; $('rows').innerHTML = ''; $('panel').style.display = 'none'; $('login').style.display = ''; };
  $('refresh').onclick = load;

  function val(f, k) { return f && f[k] && f[k].stringValue ? f[k].stringValue : ''; }
  function load() {
    $('panelErr').textContent = ''; records = [];
    function page(tok) {
      var url = BASE + '?pageSize=300&key=' + encodeURIComponent(CFG.apiKey) + (tok ? '&pageToken=' + encodeURIComponent(tok) : '');
      return fetch(url, { headers: { Authorization: 'Bearer ' + token } }).then(function (r) {
        if (r.status === 403 || r.status === 401) throw new Error('denied');
        if (!r.ok) throw new Error('fail');
        return r.json();
      }).then(function (j) {
        (j.documents || []).forEach(function (d) {
          var f = d.fields || {};
          records.push({ id: decodeURIComponent(d.name.split('/').pop()), name: val(f, 'fullName'), sid: val(f, 'studentId'), course: val(f, 'course'),
                         year: val(f, 'year'), date: val(f, 'date'), sig: safeSig(val(f, 'signature')), created: val(f, 'createdAt') });
        });
        if (j.nextPageToken) return page(j.nextPageToken);
      });
    }
    page().then(function () {
      records.sort(function (a, b) { return (a.created || '').localeCompare(b.created || ''); });
      render();
    }).catch(function (e) {
      $('panelErr').textContent = e.message === 'denied'
        ? 'This account is not allowed to view the petition. Check that the admin email in the Firestore rules matches the one you signed in with.'
        : 'Could not load the signatures. Please try Refresh.';
    });
  }
  function render() {
    $('count').textContent = records.length + (records.length === 1 ? ' signature' : ' signatures');
    var tb = $('rows'); tb.innerHTML = '';
    records.forEach(function (r, i) {
      var tr = document.createElement('tr');
      [i + 1, r.name, r.sid, r.course, r.year, fmtDate(r.date)].forEach(function (v) { var td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
      var tdS = document.createElement('td');
      if (r.sig) { var im = document.createElement('img'); im.src = r.sig; im.alt = 'signature'; tdS.appendChild(im); }
      tr.appendChild(tdS);
      var tdD = document.createElement('td'), b = document.createElement('button'); b.className = 'del'; b.textContent = 'Delete';
      b.onclick = function () { del(r); }; tdD.appendChild(b); tr.appendChild(tdD);
      tb.appendChild(tr);
    });
  }
  function del(r) {
    if (!confirm('Delete the signature of ' + r.name + ' (' + r.sid + ')? This cannot be undone.')) return;
    fetch(BASE + '/' + encodeURIComponent(r.id) + '?key=' + encodeURIComponent(CFG.apiKey), { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } })
      .then(function (x) { if (!x.ok) throw 0; load(); }).catch(function () { $('panelErr').textContent = 'Could not delete that entry.'; });
  }

  /* ---- CSV ---- */
  function csvCell(v) { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
  $('csv').onclick = function () {
    var lines = [['No', 'Student Name', 'ID Number', 'Course Name', 'Year', 'Date'].map(csvCell).join(',')];
    records.forEach(function (r, i) { lines.push([i + 1, r.name, r.sid, r.course, r.year, fmtDate(r.date)].map(csvCell).join(',')); });
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bigger-prayer-room-petition.csv'; document.body.appendChild(a); a.click(); a.remove();
  };

  /* ---- PDF ---- */
  function loadLogo() {
    return fetch('bmet-logo.png').then(function (r) { return r.blob(); }).then(function (b) {
      return new Promise(function (res) {
        var fr = new FileReader(); fr.onload = function () {
          var im = new Image(); im.onload = function () { res({ data: fr.result, w: im.naturalWidth, h: im.naturalHeight }); }; im.onerror = function () { res(null); }; im.src = fr.result;
        }; fr.onerror = function () { res(null); }; fr.readAsDataURL(b);
      });
    }).catch(function () { return null; });
  }
  $('pdf').onclick = function () {
    if (!records.length) { alert('There are no signatures yet.'); return; }
    loadLogo().then(function (logo) {
      var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      var W = doc.internal.pageSize.getWidth(), M = 14, green = [14, 75, 58];
      if (logo) { var lh = 20, lw = lh * logo.w / logo.h; doc.addImage(logo.data, 'PNG', M, 10, lw, lh); }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(green[0], green[1], green[2]);
      doc.text('Request for a Bigger Friday Prayer Room', W / 2, 19, { align: 'center' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(60, 60, 60);
      doc.text('BMet Matthew Boulton College  |  Student petition for Jumu\'ah prayer space', W / 2, 26, { align: 'center' });
      doc.setFontSize(10); doc.setTextColor(30, 30, 30);
      var lines = doc.splitTextToSize(STATEMENT, W - 2 * M); doc.text(lines, M, 38);
      var y = 38 + lines.length * 5 + 2;
      doc.setFont('helvetica', 'bold');
      var now = new Date(), gen = ('0' + now.getDate()).slice(-2) + '/' + ('0' + (now.getMonth() + 1)).slice(-2) + '/' + now.getFullYear();
      doc.text('Total signatures: ' + records.length + '     Generated: ' + gen, M, y);
      var body = records.map(function (r, i) { return [String(i + 1), r.name, r.sid, r.course, r.year, fmtDate(r.date), '']; });
      doc.autoTable({
        startY: y + 4, margin: { left: M, right: M, bottom: 16 },
        head: [['No.', 'Student Name', 'ID Number', 'Course Name', 'Year', 'Date', 'Signature']], body: body,
        theme: 'grid', styles: { font: 'helvetica', fontSize: 10, cellPadding: 2, minCellHeight: 14, valign: 'middle', lineColor: [120, 120, 120], lineWidth: 0.2 },
        headStyles: { fillColor: green, textColor: 255, halign: 'left', fontStyle: 'bold' },
        columnStyles: { 0: { cellWidth: 12 }, 1: { cellWidth: 55 }, 2: { cellWidth: 30 }, 3: { cellWidth: 60 }, 4: { cellWidth: 18 }, 5: { cellWidth: 26 }, 6: { cellWidth: 'auto' } },
        didDrawCell: function (d) {
          if (d.section === 'body' && d.column.index === 6) {
            var sig = records[d.row.index].sig;
            if (sig) { try { doc.addImage(sig, 'PNG', d.cell.x + 1.5, d.cell.y + 1, d.cell.width - 3, d.cell.height - 2); } catch (e) {} }
          }
        }
      });
      var n = doc.internal.getNumberOfPages();
      for (var p = 1; p <= n; p++) {
        doc.setPage(p); doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(110, 110, 110);
        doc.text('Page ' + p + ' of ' + n, W - M, doc.internal.pageSize.getHeight() - 8, { align: 'right' });
      }
      doc.save('Request-Bigger-Friday-Prayer-Room.pdf');
    });
  };
})();
</script>
</body>
</html>
